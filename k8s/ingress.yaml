# Ingress — the "front door" that creates an ALB
#
# When you apply this, the AWS Load Balancer Controller sees it and
# automatically creates an internet-facing ALB in AWS. The ALB gets a
# public DNS name and routes everything to the inference backend.
#
#   /*  → backend-svc:8000   (FastAPI inference routes: /generate, /files, /health)
#
# This is a second milestone. The CDK stack does not install the AWS Load
# Balancer Controller yet, so this manifest will not create an ALB until that
# controller exists in the cluster.
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sdxl-kube-ingress
  namespace: sdxl-kube
  annotations:
    # Tell AWS LB Controller to create an ALB (not NLB)
    kubernetes.io/ingress.class: alb
    # Internet-facing (not internal)
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Listen on port 80 (add 443 + ACM certificate for HTTPS later)
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # Health check path on the backend pods
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 8000
