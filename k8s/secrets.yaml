# Secrets — sensitive values (API keys, tokens)
#
# WARNING: In production, use AWS Secrets Manager + External Secrets Operator
# instead of storing secrets in YAML. This is for development only.
#
# To create this secret without committing values to git:
#   kubectl create secret generic sdxl-kube-secrets \
#     --namespace sdxl-kube \
#     --from-literal=hf-token=hf_YOUR_TOKEN_HERE
#
apiVersion: v1
kind: Secret
metadata:
  name: sdxl-kube-secrets
  namespace: sdxl-kube
type: Opaque
data:
  # Base64 encoded values — replace with your actual tokens:
  #   echo -n "hf_YOUR_TOKEN" | base64
  hf-token: REPLACE_WITH_BASE64_ENCODED_TOKEN
