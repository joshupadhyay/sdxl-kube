# Backend Service — internal load balancer
#
# This gives backend pods a stable internal hostname: "backend-svc".
# Ingress or port-forwarding can route traffic to this service.
# If you had multiple backend replicas, the service would load-balance between them.
#
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: sdxl-kube
spec:
  type: ClusterIP              # Internal only — not exposed to internet directly
  selector:
    app: sdxl-kube
    component: backend
  ports:
    - port: 8000               # The port other pods use to reach this service
      targetPort: 8000         # The port the container listens on
      protocol: TCP
