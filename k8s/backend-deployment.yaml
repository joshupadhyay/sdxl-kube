# Backend Deployment — FastAPI + SDXL inference on GPU
#
# This tells k8s: "Run 1 copy of the backend container on a GPU node."
# If it crashes, k8s restarts it. If you want more, change replicas.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sdxl-kube
  labels:
    app: sdxl-kube
    component: backend
spec:
  replicas: 1                    # Only 1 — GPU nodes are expensive (~$1/hr each)
  selector:
    matchLabels:
      app: sdxl-kube
      component: backend
  template:
    metadata:
      labels:
        app: sdxl-kube
        component: backend
    spec:
      serviceAccountName: sdxl-kube-api
      # Schedule this pod ONLY on GPU nodes
      nodeSelector:
        workload: gpu
      # GPU nodes have a "taint" that repels non-GPU pods.
      # This toleration says "I'm allowed on GPU nodes."
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: api
          image: ${ECR_BACKEND_URI}:${IMAGE_TAG}
          ports:
            - containerPort: 8000
          env:
            - name: S3_BUCKET
              value: "${S3_BUCKET}"
            - name: S3_REGION
              value: "us-east-1"
            - name: ADAPTER_PATH
              value: "/models/adapters/v1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sdxl-kube-secrets
                  key: hf-token
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"      # Request 1 GPU
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"      # Limit to 1 GPU
          # k8s uses this to know when the pod is ready to receive traffic
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120   # Model loading takes ~2 min
            periodSeconds: 10
          # k8s uses this to know when to restart a crashed pod
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
