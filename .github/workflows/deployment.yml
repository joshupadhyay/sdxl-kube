name: CDK Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cdk-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install CDK dependencies
        working-directory: cdk
        run: bun install --frozen-lockfile

      - name: Compile CDK
        working-directory: cdk
        run: bun run build
